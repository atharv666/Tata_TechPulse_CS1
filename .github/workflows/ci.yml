name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend lint, types, migrations and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: autosar_assistant
          POSTGRES_USER: autosar
          POSTGRES_PASSWORD: development-only-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Only used to connect and issue CREATE DATABASE: the tests build a throwaway database.
      DATABASE_URL: postgresql://autosar:development-only-change-me@localhost:5432/autosar_assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff format
        run: ruff format --check backend worker tests scripts

      - name: Ruff lint
        run: ruff check backend worker tests scripts

      - name: Mypy (backend, strict)
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Mypy (worker entry point)
        run: MYPYPATH=backend mypy --ignore-missing-imports worker/worker_runner

      - name: Migrations apply to an empty database
        working-directory: backend
        run: alembic upgrade head

      - name: Tests (throwaway database, hermetic providers)
        run: pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: No committed secrets or archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_no_secrets.py

  docker:
    name: Compose builds and boots with the real worker
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Boot stack with hermetic providers
        env:
          LLM_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
          EMBEDDING_MODEL: fake-embedding
        run: |
          docker compose up -d postgres backend worker
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health/ready && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Worker is running (not crash-looping)
        run: |
          sleep 10
          test "$(docker inspect -f '{{.State.Running}}' autosar_worker)" = "true"
          test "$(docker inspect -f '{{.RestartCount}}' autosar_worker)" = "0"
