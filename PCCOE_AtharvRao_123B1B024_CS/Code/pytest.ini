[pytest]
# Single, explicit test entry point. The submission package folder (PCCOE_*) contains a
# copy of the code base and must never be collected together with the real tests.
testpaths = tests
pythonpath = backend .
norecursedirs = PCCOE_* node_modules .git .venv venv dist build data frontend .mypy_cache .ruff_cache texts
addopts = -q
markers =
    integration: needs PostgreSQL with pgvector and pg_trgm (a throwaway database is created automatically)
    live: calls real external providers; skipped unless RUN_LIVE_TESTS=1 and credentials are configured
